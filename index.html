<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alb Enerji CRM Demo</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e6e8ec;
      --accent: #1f2937;
      --accent-soft: #eff6ff;
      --primary: #111827;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0.2px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(245, 246, 248, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px 8px;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 600;
    }
    .pill-toggle {
      display: flex;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .pill-toggle button {
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
    }
    .pill-toggle button.active {
      background: var(--primary);
      color: #fff;
    }
    nav {
      display: flex;
      gap: 16px;
      padding: 8px 32px 16px;
      overflow-x: auto;
    }
    nav button {
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 2px;
      border-bottom: 2px solid transparent;
    }
    nav button.active {
      color: var(--text);
      border-color: var(--text);
    }
    main {
      padding: 24px 32px 80px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h1 { margin: 0; font-size: 28px; font-weight: 600; }
    h2 { margin: 0; font-size: 20px; font-weight: 600; }
    h3 { margin: 0; font-size: 16px; font-weight: 600; }
    p { margin: 6px 0 0; }
    .muted { color: var(--muted); }
    .page-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .grid { display: grid; gap: 16px; }
    .grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
    .btn.subtle { background: var(--accent-soft); color: var(--primary); }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .list-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      background: #f3f4f6;
      color: #374151;
    }
    .input, select, textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 13px;
      background: #fff;
    }
    textarea { min-height: 84px; resize: vertical; }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .detail-tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .detail-tabs button {
      border: none;
      background: transparent;
      padding: 10px 0;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .detail-tabs button.active { color: var(--text); border-color: var(--text); }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-item {
      border-left: 2px solid var(--line);
      padding-left: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.25);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: min(720px, 100%);
      padding: 24px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .kanban {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .kanban-column {
      background: #f8fafc;
      border-radius: 16px;
      padding: 12px;
      border: 1px solid var(--line);
    }
    .kanban-card {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1d4ed8, #38bdf8);
    }
    .progress-marker {
      position: absolute;
      top: -6px;
      width: 2px;
      height: 22px;
      background: #cbd5f5;
    }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table th, .table td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .table td:last-child { text-align: right; }
    @media (max-width: 900px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      main { padding: 20px 16px 80px; }
      nav { padding: 8px 16px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 13.5L12 3l8 10.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/><path d="M6 13.5h12l-1.8 7.5H7.8L6 13.5z" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/></svg>
        Alb Enerji CRM
      </div>
      <div class="pill-toggle" id="roleToggle"></div>
    </div>
    <nav id="navTabs"></nav>
  </header>
  <main id="app"></main>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalContent"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "alb_crm_data_v2";
    const SETTINGS_KEY = "alb_crm_settings_v2";
    const ROLE_KEY = "alb_crm_role";
    const roles = ["YÖNETİCİ", "SATIŞ", "TEKNİK OFİS"];
    const tabs = [
      "Ana Panel",
      "Pipeline",
      "Lead’ler",
      "Müşteriler",
      "Teklifler",
      "Siparişler",
      "Görevler",
      "Partner Programı",
      "Ayarlar / Veri"
    ];

    const defaultSettings = {
      currency: "USD",
      defaultPanelWattage: 550,
      defaultWarehouse: "Antalya"
    };

    const emptyData = () => ({
      leads: [],
      accounts: [],
      opportunities: [],
      quotes: [],
      orders: [],
      tasks: [],
      partners: [],
      purchases: [],
      shipments: [],
      counters: {
        lead: 1,
        account: 1,
        opportunity: 1,
        quote: 1,
        order: 1,
        task: 1,
        partner: 1,
        purchase: 1,
        shipment: 1,
        quoteSeq: 1,
        orderSeq: 1
      }
    });

    const state = {
      activeTab: tabs[0],
      role: localStorage.getItem(ROLE_KEY) || roles[0],
      data: emptyData(),
      settings: defaultSettings,
      selected: { type: null, id: null },
      detailTab: "Özet"
    };

    const toast = document.getElementById("toast");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalContent = document.getElementById("modalContent");

    const showToast = (message) => {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    };

    const formatUSD = (value) => new Intl.NumberFormat("tr-TR", {
      style: "currency",
      currency: state.settings.currency,
      maximumFractionDigits: 0
    }).format(value || 0);

    const daysBetween = (start, end) => {
      const a = new Date(start);
      const b = new Date(end);
      return Math.max(0, Math.round((b - a) / (1000 * 60 * 60 * 24)));
    };

    const nowISO = () => new Date().toISOString();
    const shortDate = (value) => value ? new Date(value).toISOString().slice(0, 10) : "";

    const generateId = (type) => {
      const id = `${type}-${state.data.counters[type]}`;
      state.data.counters[type] += 1;
      return id;
    };
    const generateQuoteNo = () => {
      const year = new Date().getFullYear();
      const seq = String(state.data.counters.quoteSeq).padStart(4, "0");
      state.data.counters.quoteSeq += 1;
      return `ALB-Q-${year}-${seq}`;
    };
    const generateOrderNo = () => {
      const year = new Date().getFullYear();
      const seq = String(state.data.counters.orderSeq).padStart(4, "0");
      state.data.counters.orderSeq += 1;
      return `ALB-O-${year}-${seq}`;
    };

    const computeOpportunityValue = (opp) => {
      const qty = Number(opp.expectedPanelsQty || 0);
      const watt = Number(opp.panelWattage || state.settings.defaultPanelWattage || 0);
      const price = Number(opp.targetPricePerWatt || 0);
      return Math.round(qty * watt * price);
    };

    const can = (action) => {
      const role = state.role;
      const rules = {
        editTargetPrice: ["YÖNETİCİ"],
        editDiscount: ["YÖNETİCİ"],
        markQuoteAccepted: ["YÖNETİCİ"],
        createOrder: ["YÖNETİCİ"],
        manageShipments: ["YÖNETİCİ"],
        moveToAdvancedStage: ["YÖNETİCİ"],
        editPricing: ["YÖNETİCİ", "SATIŞ"],
        createQuote: ["YÖNETİCİ", "SATIŞ"],
        editOpportunity: ["YÖNETİCİ", "SATIŞ", "TEKNİK OFİS"],
        editLead: ["YÖNETİCİ", "SATIŞ"],
        editTask: ["YÖNETİCİ", "SATIŞ"],
        editPartner: ["YÖNETİCİ"]
      };
      return (rules[action] || ["YÖNETİCİ"]).includes(role);
    };

    const fieldLock = (entity, field) => {
      const role = state.role;
      if (entity === "opportunity" && field === "targetPricePerWatt") return role !== "YÖNETİCİ";
      if (entity === "quote" && field === "discountUSD") return role !== "YÖNETİCİ";
      if (entity === "quoteItem" && field === "unitPriceUSD") return role === "TEKNİK OFİS";
      if (entity === "quote" && field === "status") return role !== "YÖNETİCİ";
      return false;
    };

    const withDefaults = (item, defaults) => ({ ...defaults, ...item });

    const normalizeData = () => {
      const data = state.data;
      data.leads = data.leads.map(lead => withDefaults(lead, {
        id: generateId("lead"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        source: "Web",
        status: "Yeni",
        companyName: "",
        contactName: "",
        phone: "",
        email: "",
        city: "",
        country: "Türkiye",
        segment: "Konut",
        interest: "Panel",
        notes: [],
        tags: [],
        owner: "SATIŞ",
        lastTouchAt: nowISO(),
        nextActionAt: nowISO(),
        timeline: []
      }));
      data.accounts = data.accounts.map(account => withDefaults(account, {
        id: generateId("account"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        companyName: "",
        taxNo: "",
        city: "",
        country: "Türkiye",
        type: "Son kullanıcı",
        contacts: [],
        accountNotes: [],
        timeline: []
      }));
      data.opportunities = data.opportunities.map(opp => withDefaults(opp, {
        id: generateId("opportunity"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        leadId: "",
        accountId: "",
        title: "",
        stage: "Lead",
        expectedPanelsQty: 0,
        panelModel: "",
        panelWattage: state.settings.defaultPanelWattage,
        targetPricePerWatt: 0.19,
        expectedCloseDate: shortDate(nowISO()),
        probability: 30,
        competitor: "",
        owner: "SATIŞ",
        timeline: [],
        stageUpdatedAt: nowISO()
      }));
      data.quotes = data.quotes.map(quote => withDefaults(quote, {
        id: generateId("quote"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        opportunityId: "",
        quoteNo: generateQuoteNo(),
        items: [],
        totals: { subtotalUSD: 0, discountUSD: 0, shippingUSD: 0, grandTotalUSD: 0 },
        paymentTerms: "LC90",
        deliveryTerms: "FOB",
        status: "Taslak",
        pdfPreviewMode: true,
        timeline: []
      }));
      data.orders = data.orders.map(order => withDefaults(order, {
        id: generateId("order"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        opportunityId: "",
        orderNo: generateOrderNo(),
        status: "Alındı",
        promisedShipDate: shortDate(nowISO()),
        warehouse: state.settings.defaultWarehouse,
        logisticsNotes: "",
        timeline: []
      }));
      data.tasks = data.tasks.map(task => withDefaults(task, {
        id: generateId("task"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        title: "",
        relatedTo: "",
        dueDate: shortDate(nowISO()),
        priority: "Orta",
        status: "Açık",
        owner: "SATIŞ"
      }));
      data.partners = data.partners.map(partner => withDefaults(partner, {
        id: generateId("partner"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        accountId: "",
        companyName: "",
        yearlyTarget: 1000,
        timeline: []
      }));
      data.purchases = data.purchases.map(purchase => withDefaults(purchase, {
        id: generateId("purchase"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        partnerId: "",
        date: shortDate(nowISO()),
        qtyPanels: 0,
        panelWattage: state.settings.defaultPanelWattage
      }));
      data.shipments = data.shipments.map(shipment => withDefaults(shipment, {
        id: generateId("shipment"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        partnerId: "",
        date: shortDate(nowISO()),
        qtyPanels: 0
      }));
    };

    const loadData = () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state.data = { ...emptyData(), ...JSON.parse(saved) };
      }
      const savedSettings = localStorage.getItem(SETTINGS_KEY);
      state.settings = savedSettings ? { ...defaultSettings, ...JSON.parse(savedSettings) } : defaultSettings;
      normalizeData();
    };
    const saveData = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
    };

    const addTimeline = (collection, id, text) => {
      const item = state.data[collection].find(entry => entry.id === id);
      if (!item) return;
      item.timeline = item.timeline || [];
      item.timeline.unshift(`${new Date().toLocaleDateString("tr-TR")} · ${text}`);
    };

    // Partner bonus engine (retroactive, weighted wattage, multi-threshold)
    const partnerBonusEngine = (purchases, shipments = []) => {
      const tiers = [
        { threshold: 0, price: 0.19 },
        { threshold: 400, price: 0.185 },
        { threshold: 700, price: 0.18 },
        { threshold: 1000, price: 0.175 }
      ];
      const sorted = [...purchases].sort((a, b) => new Date(a.date) - new Date(b.date));
      const totalPanels = sorted.reduce((sum, p) => sum + Number(p.qtyPanels || 0), 0);
      const wattForFirstN = (n) => {
        let remaining = n;
        let watt = 0;
        for (const purchase of sorted) {
          if (remaining <= 0) break;
          const qty = Math.min(remaining, Number(purchase.qtyPanels || 0));
          watt += qty * Number(purchase.panelWattage || state.settings.defaultPanelWattage);
          remaining -= qty;
        }
        return watt;
      };
      const crossings = [
        { threshold: 400, from: 0.19, to: 0.185 },
        { threshold: 700, from: 0.185, to: 0.18 },
        { threshold: 1000, from: 0.18, to: 0.175 }
      ];
      const discountValue = crossings.reduce((sum, cross) => {
        if (totalPanels >= cross.threshold) {
          const wattage = wattForFirstN(cross.threshold);
          return sum + (cross.from - cross.to) * wattage;
        }
        return sum;
      }, 0);
      const currentTier = totalPanels >= 1000 ? tiers[3] : totalPanels >= 700 ? tiers[2] : totalPanels >= 400 ? tiers[1] : tiers[0];
      const baseWattage = totalPanels ? wattForFirstN(Math.min(totalPanels, currentTier.threshold || totalPanels)) : 0;
      const weightedAvgWatt = baseWattage && (currentTier.threshold ? baseWattage / currentTier.threshold : state.settings.defaultPanelWattage);
      const earnedBonusPanels = currentTier.price && weightedAvgWatt ? discountValue / (currentTier.price * weightedAvgWatt) : 0;
      const shippedPanels = shipments.reduce((sum, s) => sum + Number(s.qtyPanels || 0), 0);
      const remainingPanels = Math.max(0, earnedBonusPanels - shippedPanels);
      const nextThreshold = totalPanels < 400 ? 400 : totalPanels < 700 ? 700 : totalPanels < 1000 ? 1000 : null;
      const remainingToNext = nextThreshold ? Math.max(0, nextThreshold - totalPanels) : 0;
      const lastPurchaseBonus = (() => {
        if (!sorted.length) return 0;
        const trimmed = sorted.slice(0, -1);
        const prev = partnerBonusEngine(trimmed, shipments);
        return Math.max(0, earnedBonusPanels - prev.earnedBonusPanels);
      })();
      return {
        totalPanels,
        currentTier,
        earnedBonusPanels,
        shippedPanels,
        remainingPanels,
        nextThreshold,
        remainingToNext,
        lastPurchaseBonus
      };
    };

    const openModal = ({ title, subtitle, fields, onSave, confirmText = "Kaydet" }) => {
      modalContent.innerHTML = `
        <div class="modal-header">
          <div>
            <h2>${title}</h2>
            <p class="muted">${subtitle || ""}</p>
          </div>
          <button class="btn secondary" id="modalClose">Kapat</button>
        </div>
        <div class="modal-body" style="margin-top:16px;">
          <div class="form-grid">
            ${fields.map(field => {
              if (field.type === "textarea") {
                return `
                  <div style="grid-column: span 2;">
                    <label>${field.label}</label>
                    <textarea class="input" data-field="${field.name}" ${field.disabled ? "disabled" : ""}>${field.value || ""}</textarea>
                    ${field.hint ? `<div class="hint">${field.hint}</div>` : ""}
                  </div>
                `;
              }
              if (field.type === "select") {
                return `
                  <div>
                    <label>${field.label}</label>
                    <select class="input" data-field="${field.name}" ${field.disabled ? "disabled" : ""}>
                      ${field.options.map(opt => `<option value="${opt}" ${opt === field.value ? "selected" : ""}>${opt}</option>`).join("")}
                    </select>
                    ${field.hint ? `<div class="hint">${field.hint}</div>` : ""}
                  </div>
                `;
              }
              return `
                <div>
                  <label>${field.label}</label>
                  <input class="input" type="${field.type || "text"}" data-field="${field.name}" value="${field.value ?? ""}" ${field.disabled ? "disabled" : ""} />
                  ${field.hint ? `<div class="hint">${field.hint}</div>` : ""}
                </div>
              `;
            }).join("")}
          </div>
          <div class="hint" id="modalValidation" style="margin-top:10px;"></div>
        </div>
        <div class="modal-footer">
          <button class="btn secondary" id="modalCancel">İptal</button>
          <button class="btn primary" id="modalSave">${confirmText}</button>
        </div>
      `;
      modalBackdrop.classList.add("active");
      const closeModal = () => modalBackdrop.classList.remove("active");
      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalSave").addEventListener("click", () => {
        const values = {};
        fields.forEach(field => {
          const el = modalContent.querySelector(`[data-field="${field.name}"]`);
          values[field.name] = field.type === "number" ? Number(el.value) : el.value;
        });
        if (fields.some(f => f.required && !values[f.name])) {
          document.getElementById("modalValidation").textContent = "Lütfen gerekli alanları doldurun.";

      const shipping = Number(quote.totals.shippingUSD || 0);
      quote.totals.subtotalUSD = subtotal;
      quote.totals.grandTotalUSD = Math.max(0, subtotal - discount + shipping);

        fields: [
          { label: "Başlık", name: "title", value: task?.title, required: true },
          { label: "Vade", name: "dueDate", type: "date", value: task?.dueDate || shortDate(nowISO()) },
          { label: "Öncelik", name: "priority", type: "select", value: task?.priority || "Orta", options: ["Düşük", "Orta", "Yüksek"] },
          { label: "Durum", name: "status", type: "select", value: task?.status || "Açık", options: ["Açık", "Bitti"] },
          { label: "Sorumlu", name: "owner", value: task?.owner || state.role }
        ],
        onSave: (values) => {
          if (task) {
            Object.assign(task, values, { updatedAt: nowISO() });
            task.timeline = task.timeline || [];
            task.timeline.unshift(`${new Date().toLocaleDateString("tr-TR")} · Görev güncellendi`);
          } else {
            const newTask = {
              id: generateId("task"),
              createdAt: nowISO(),
              updatedAt: nowISO(),
              timeline: []
            };
            Object.assign(newTask, values);
            newTask.timeline.unshift(`${new Date().toLocaleDateString("tr-TR")} · Görev oluşturuldu`);
            state.data.tasks.unshift(newTask);
          }
          saveData();
          showToast("Görev kaydedildi");
          renderTasks();
        }
      });
    };

    const openPartnerModal = (id) => {
      const partner = id ? state.data.partners.find(item => item.id === id) : null;
      openModal({
        title: id ? "Partner düzenle" : "Yeni partner",
        subtitle: "Bayi hedefleri ve temel bilgiler.",
        fields: [
          { label: "Şirket adı", name: "companyName", value: partner?.companyName, required: true },
          { label: "Yıllık hedef (panel)", name: "yearlyTarget", type: "number", value: partner?.yearlyTarget || 1000 }
        ],
        onSave: (values) => {
          if (partner) {
            Object.assign(partner, values, { updatedAt: nowISO() });
            addTimeline("partners", partner.id, "Partner güncellendi");
          } else {
            const newPartner = {
              id: generateId("partner"),
              createdAt: nowISO(),
              updatedAt: nowISO(),
              timeline: []
            };
            Object.assign(newPartner, values);
            addTimeline("partners", newPartner.id, "Partner oluşturuldu");
            state.data.partners.unshift(newPartner);
          }
          saveData();
          showToast("Partner kaydedildi");
          renderPartners();
        }
      });
    };

    const openPurchaseModal = (partnerId) => {
      openModal({
        title: "Alım ekle",
        subtitle: "Panel alım kaydı oluşturun.",
        fields: [
          { label: "Tarih", name: "date", type: "date", value: shortDate(nowISO()), required: true },
          { label: "Panel adedi", name: "qtyPanels", type: "number", value: 0, required: true },
          { label: "Panel watt", name: "panelWattage", type: "number", value: state.settings.defaultPanelWattage }
        ],
        onSave: (values) => {
          state.data.purchases.unshift({
            id: generateId("purchase"),
            createdAt: nowISO(),
            updatedAt: nowISO(),
            partnerId,
            ...values
          });
          addTimeline("partners", partnerId, `Alım eklendi: ${values.qtyPanels} panel`);
          saveData();
          showToast("Alım kaydedildi");
          renderPartners();
        }
      });
    };

    const openShipmentModal = (partnerId) => {
      openModal({
        title: "Bonus sevki",
        subtitle: "Bonus panel sevkini kaydedin.",
        fields: [
          { label: "Tarih", name: "date", type: "date", value: shortDate(nowISO()), required: true },
          { label: "Panel adedi", name: "qtyPanels", type: "number", value: 0, required: true }
        ],
        onSave: (values) => {
          state.data.shipments.unshift({
            id: generateId("shipment"),
            createdAt: nowISO(),
            updatedAt: nowISO(),
            partnerId,
            ...values
          });
          addTimeline("partners", partnerId, `Bonus sevk: ${values.qtyPanels} panel`);
          saveData();
          showToast("Sevk kaydedildi");
          renderPartners();
        }
      });
    };

    const confirmDelete = (collection, id) => {
      openConfirm({
        title: "Silme onayı",
        subtitle: "Bu kayıt geri alınamaz.",
        onConfirm: () => {
          state.data[collection + "s"] = state.data[collection + "s"].filter(item => item.id !== id);
          saveData();
          showToast("Kayıt silindi");
          renderApp();
        }
      });
    };

    // Demo data generator with required minimum dataset
    const seedDemoData = () => {
      state.data = emptyData();
      const sources = ["Instagram", "LinkedIn", "Web", "Fuar", "Referans", "Facebook"];
      const segments = ["Konut", "Ticari", "EPC", "Bayi"];
      const cities = ["İstanbul", "Ankara", "İzmir", "Antalya", "Bursa", "Adana"];
      for (let i = 0; i < 12; i++) {
        state.data.leads.push({
          id: generateId("lead"),
          createdAt: nowISO(),
          updatedAt: nowISO(),
          source: sources[i % sources.length],
          status: ["Yeni", "Temas Edildi", "Nitelikli", "Elendi"][i % 4],
          companyName: `Lead Şirket ${i + 1}`,
          contactName: `Kişi ${i + 1}`,
          phone: "+90 5xx xxx xx xx",
          email: `lead${i + 1}@example.com`,
          city: cities[i % cities.length],
          country: "Türkiye",
          segment: segments[i % segments.length],
          interest: ["Panel", "EPC", "Depolama", "EV Şarj"][i % 4],
          notes: [],
          tags: ["Sıcak"],
          owner: i % 2 === 0 ? "SATIŞ" : "TEKNİK OFİS",
          lastTouchAt: nowISO(),
          nextActionAt: nowISO(),
          timeline: ["Demo lead oluşturuldu"]
        });
      }
      for (let i = 0; i < 6; i++) {
        state.data.opportunities.push({
          id: generateId("opportunity"),
          createdAt: nowISO(),
          updatedAt: nowISO(),
          leadId: state.data.leads[i].id,
          accountId: "",
          title: `Fırsat ${i + 1}`,
          stage: ["Lead", "Nitelikli", "Teklif", "Revize", "Üretim", "Sevk"][i],
          expectedPanelsQty: 400 + i * 60,
          panelModel: "Alb Mono",
          panelWattage: 550,
          targetPricePerWatt: 0.19 - i * 0.002,
          expectedCloseDate: shortDate(nowISO()),
          probability: 30 + i * 10,
          competitor: "",
          owner: i % 2 === 0 ? "SATIŞ" : "YÖNETİCİ",
          stageUpdatedAt: nowISO(),
          timeline: []
        });
      }
      for (let i = 0; i < 4; i++) {
        const quote = {
          id: generateId("quote"),
          createdAt: nowISO(),
          updatedAt: nowISO(),
          opportunityId: state.data.opportunities[i].id,
          quoteNo: generateQuoteNo(),
          items: [
            { type: "Panel", description: `Alb Mono ${550}W`, qty: 500 + i * 50, unit: "Adet", unitPriceUSD: 90 - i }
          ],
          totals: { subtotalUSD: 45000 + i * 2000, discountUSD: 0, shippingUSD: 1500, grandTotalUSD: 46500 + i * 2000 },
          paymentTerms: ["LC90", "Kredi Kartı", "Nakit", "Vade"][i % 4],
          deliveryTerms: ["FOB", "CIF", "CIP", "Exworks"][i % 4],
          status: ["Taslak", "Gönderildi", "Kabul", "Red"][i % 4],
          pdfPreviewMode: true,
          timeline: []
        };
        state.data.quotes.push(quote);
      }
      for (let i = 0; i < 2; i++) {
        state.data.orders.push({
          id: generateId("order"),
          createdAt: nowISO(),
          updatedAt: nowISO(),
          opportunityId: state.data.opportunities[i].id,
          orderNo: generateOrderNo(),
          status: ["Alındı", "Üretimde"][i],
          promisedShipDate: shortDate(nowISO()),
          warehouse: i === 0 ? "Antalya" : "Tivat",
          logisticsNotes: "",
          timeline: []
        });
      }
      for (let i = 0; i < 8; i++) {
        state.data.tasks.push({
          id: generateId("task"),
          createdAt: nowISO(),
          updatedAt: nowISO(),
          title: `Görev ${i + 1}`,
          relatedTo: "opportunity",
          dueDate: shortDate(nowISO()),
          priority: ["Düşük", "Orta", "Yüksek"][i % 3],
          status: "Açık",
          owner: i % 2 === 0 ? "SATIŞ" : "TEKNİK OFİS"
        });
      }
      const partnerNames = ["Ege Solar", "Balkan EPC", "Atlas Enerji"];
      partnerNames.forEach((name, idx) => {
        const partnerId = generateId("partner");
        state.data.partners.push({
          id: partnerId,
          createdAt: nowISO(),
          updatedAt: nowISO(),
          accountId: "",
          companyName: name,
          yearlyTarget: 1000,
          timeline: []
        });
        const purchaseSets = [
          [200, 250],
          [500, 320],
          [700, 420, 180]
        ];
        purchaseSets[idx].forEach((qty) => {
          state.data.purchases.push({
            id: generateId("purchase"),
            createdAt: nowISO(),
            updatedAt: nowISO(),
            partnerId,
            date: shortDate(nowISO()),
            qtyPanels: qty,
            panelWattage: 550 + idx * 10
          });
        });
        state.data.shipments.push({
          id: generateId("shipment"),
          createdAt: nowISO(),
          updatedAt: nowISO(),
          partnerId,
          date: shortDate(nowISO()),
          qtyPanels: 40 + idx * 10
        });
      });
      state.data.accounts.push({
        id: generateId("account"),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        companyName: "Alb Enerji Demo",
        taxNo: "1234567890",
        city: "İstanbul",
        country: "Türkiye",
        type: "EPC",
        contacts: [{ name: "Ayşe Demir", role: "Satınalma", phone: "+90 5xx", email: "ayse@example.com" }],
        accountNotes: ["Demo hesap notu"],
        timeline: []
      });
      saveData();
    };

    const renderApp = () => {
      renderRoleToggle();
      renderTabs();
      if (state.activeTab === "Ana Panel") return renderDashboard();
      if (state.activeTab === "Pipeline") return renderOpportunities();
      if (state.activeTab === "Lead’ler") return renderLeads();
      if (state.activeTab === "Müşteriler") return renderAccounts();
      if (state.activeTab === "Teklifler") return renderQuotes();
      if (state.activeTab === "Siparişler") return renderOrders();
      if (state.activeTab === "Görevler") return renderTasks();
      if (state.activeTab === "Partner Programı") return renderPartners();
      if (state.activeTab === "Ayarlar / Veri") return renderSettings();
    };

    loadData();
    renderApp();
  </script>
</body>
</html>
